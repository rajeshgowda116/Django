<!DOCTYPE html>
<html>

<head>
  <title>Result</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      width: 400px;
      margin: 50px auto;
      border-radius: 12px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      margin-bottom: 15px;
    }

    table,
    th,
    td {
      border: 1px solid #ddd;
      border-collapse: collapse;
      padding: 10px;
    }

    th {
      background: #007bff;
      color: white;
    }

    .result {
      font-size: 18px;
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background: green;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Student Result</h2>

    <table>
      <tr>
        <th>Subject</th>
        <th>Marks</th>
      </tr>
      <tr>
        <td>{{ marks.s1_name }}</td>
        <td>{{ marks.s1_marks }}</td>
      </tr>
      <tr>
        <td>{{ marks.s2_name }}</td>
        <td>{{ marks.s2_marks }}</td>
      </tr>
      <tr>
        <td>{{ marks.s3_name }}</td>
        <td>{{ marks.s3_marks }}</td>
      </tr>
      <tr>
        <td>{{ marks.s4_name }}</td>
        <td>{{ marks.s4_marks }}</td>
      </tr>
    </table>

    <div class="result">
      <p><strong>Percentage:</strong> {{ marks.percentage }}%</p>
    </div>

    <a href="/" class="btn">Go Home</a>
  </div>

</body>

</html>
